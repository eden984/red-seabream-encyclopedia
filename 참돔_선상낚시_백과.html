<style>
:root{--paper:#faf7f0;--ink:#141414;--soft:#5a5650;--rule:#d9d3c6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Gowun Batang",serif;line-height:1.8;

.wrap{max-width:720px;margin:0 auto;padding:0 16px 80px}

.hint{font-size:13px;color:var(--soft);margin-top:24px;animation:bob 2s infinite}

nav.toc{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;margin:0 0 30px}
nav.toc ol{margin:0;padding-left:1.4em}
nav.toc a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--soft)}
nav.toc .era{color:var(--soft);font-size:13px}
section.entry{padding:36px 0 30px;border-bottom:1px solid var(--rule)}
.num{font-family:"Nanum Pen Script";font-size:30px;color:var(--soft);line-height:1}
.entry h2{font-size:clamp(24px,6vw,32px);margin:.1em 0 .1em;letter-spacing:-.01em}
.entry .era{display:inline-block;font-size:13px;border:1px solid var(--ink);border-radius:2px;padding:0 8px;margin-bottom:10px}
.entry .lead{font-size:18px;font-weight:700;margin:.6em 0}
figure{margin:18px 0;padding:10px;border:1px solid var(--ink);background:#fffdf8;position:relative}
figure::after{content:"";position:absolute;inset:5px -5px -5px 5px;border:1px solid var(--rule);z-index:-1}
figure svg{width:100%;height:auto;display:block}
figcaption{font-family:"Nanum Pen Script";font-size:20px;text-align:center;color:var(--soft)}
svg .d{stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
svg.go .d{animation:draw var(--dur,1.4s) ease-in-out forwards;animation-delay:var(--delay,0s)}
svg .t{opacity:0}
svg.go .t{animation:fade .8s ease forwards;animation-delay:var(--tdelay,2.4s)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.reveal{opacity:0;transform:translateY(12px);transition:opacity .9s ease,transform .9s ease}
.reveal.in{opacity:1;transform:none}
.points{list-style:none;padding:0;margin:16px 0}
.points li{padding-left:28px;position:relative;margin:6px 0}
.points li::before{content:"✎";position:absolute;left:0;top:0}
.gloss{border-left:3px double var(--ink);padding:6px 0 6px 14px;margin:16px 0;font-size:15px}
.gloss b{font-weight:700}
.gloss .g-title{font-family:"Nanum Pen Script";font-size:22px}
footer{text-align:center;color:var(--soft);font-size:13px;padding-top:30px}
@media (prefers-reduced-motion:reduce){svg .d{stroke-dashoffset:0!important;animation:none!important}svg .t{opacity:1}.reveal{opacity:1;transform:none}}

<script>
const DATA = [{"title": "참돔과 선상낚시란", "era": "입문 1장", "lead": "참돔은 '바다의 여왕'이라 불리기도 하는 붉은 바닷물고기로, 배를 타고 바다로 나가 줄을 바닥까지 곧게 내려 잡는 선상낚시에서 인기가 높은 대상어(낚시로 노리는 물고기)이다.", "paragraphs": ["참돔은 몸이 옆으로 납작한 타원형이고, 분홍빛이 도는 붉은 몸에 작고 파란 점이 흩어져 있다. 주로 수심 수십 m 안팎(대략 20~100m)의 바닥 근처에 사는 것으로 알려져 있으며, 특히 바위가 많은 곳이나 모래와 자갈이 섞인 곳을 좋아한다. 한국에서는 남해와 제주, 서해 남부에서 많이 낚이며, 알을 낳기 전 살이 오르는 봄(4~6월 무렵)과 먹이를 활발히 먹는 가을(9~11월 무렵)이 제철로 알려져 있다.", "선상낚시는 낚싯배를 타고 물고기가 모여 있는 곳, 곧 '포인트'까지 나간 뒤 배 위에서 채비(바늘·봉돌·미끼 등 낚시 도구 묶음)를 바다 밑으로 내려 하는 낚시이다. 갯바위나 방파제에서 멀리 던지는 낚시와 달리 줄을 거의 수직으로 내리기 때문에, 초보자도 봉돌이 바닥에 닿는 느낌이나 물고기가 미끼를 무는 신호(입질)를 비교적 쉽게 알아챌 수 있다."], "keyPoints": ["참돔은 붉은 몸에 파란 점이 있으며, 대략 수심 20~100m의 바닥 근처에 산다.", "남해·제주·서해 남부가 주요 낚시터이고, 봄과 가을이 제철로 알려져 있다.", "선상낚시는 선장이 어군탐지기로 찾은 포인트에서 줄을 수직으로 내려 하는 낚시이다."], "glossary": [{"term": "포인트", "meaning": "물고기가 모여 있어 낚시가 잘 되는 바다 위의 특정 지점."}, {"term": "어군탐지기", "meaning": "초음파를 쏘아 물속 물고기 무리와 바닥 모양을 화면에 보여주는 장비."}, {"term": "채비", "meaning": "낚싯줄 끝에 다는 바늘, 봉돌(추), 미끼 등 낚시 도구의 묶음."}], "svg": "<svg viewBox=\"0 0 400 260\" xmlns=\"http://www.w3.org/2000/svg\"><g fill=\"none\" stroke=\"#111\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path class=\"d\" stroke-width=\"2\" d=\"M120 52 L280 52 L262 72 L138 72 Z\"/><path class=\"d\" stroke-width=\"1.6\" d=\"M175 52 L175 32 L215 32 L222 52\"/><path class=\"d\" stroke-width=\"1.2\" d=\"M183 38 L195 38 L195 46 L183 46 Z\"/><path class=\"d\" stroke-width=\"1.4\" d=\"M240 52 L250 22\"/><path class=\"d\" stroke-width=\"1\" d=\"M250 22 Q262 30 258 60\"/><path class=\"d\" stroke-width=\"1.8\" d=\"M10 74 Q30 68 50 74 T90 74 T130 74 T170 74 T210 74 T250 74 T290 74 T330 74 T370 74 T400 74\"/><path class=\"d\" stroke-width=\"1\" d=\"M20 86 Q35 82 50 86 T80 86\"/><path class=\"d\" stroke-width=\"1\" d=\"M300 90 Q315 86 330 90 T360 90\"/><path class=\"d\" stroke-width=\"1\" d=\"M60 108 Q75 104 90 108\"/><path class=\"d\" stroke-width=\"1\" d=\"M310 120 Q325 116 340 120\"/><path class=\"d\" stroke-width=\"1\" d=\"M258 60 L258 190\"/><path class=\"d\" stroke-width=\"1.6\" d=\"M255 190 L261 190 L262 200 L254 200 Z\"/><path class=\"d\" stroke-width=\"1.2\" d=\"M258 200 L258 208 Q258 214 253 213\"/><path class=\"d\" stroke-width=\"2\" d=\"M190 205 Q215 182 243 200 Q215 222 190 205 Z\"/><path class=\"d\" stroke-width=\"1.6\" d=\"M190 205 L176 194 L179 205 L176 216 Z\"/><path class=\"d\" stroke-width=\"1.2\" d=\"M205 191 Q215 180 228 190\"/><path class=\"d\" stroke-width=\"1\" d=\"M234 199 a1.5 1.5 0 1 0 0.1 0\"/><path class=\"d\" stroke-width=\"1\" d=\"M228 194 Q231 205 228 214\"/><path class=\"d\" stroke-width=\"1\" d=\"M205 200 l1 1 M213 197 l1 1 M211 207 l1 1\"/><path class=\"d\" stroke-width=\"2\" d=\"M0 232 Q40 222 80 230 Q120 238 160 228 Q200 220 240 230 Q280 240 320 226 Q360 218 400 228\"/><path class=\"d\" stroke-width=\"1\" d=\"M20 240 L28 232 M50 242 L58 230 M90 244 L98 234 M130 244 L138 234 M170 240 L178 228 M260 244 L268 234 M300 240 L308 230 M340 238 L348 226 M380 240 L388 228\"/><path class=\"d\" stroke-width=\"1.4\" d=\"M290 230 Q300 212 318 214 Q330 220 326 228\"/><path class=\"d\" stroke-width=\"1\" d=\"M80 140 L80 148 M80 156 L80 164 M80 172 L80 180\"/><\/g><text x=\"30\" y=\"66\" font-size=\"11\" fill=\"#111\" stroke=\"none\" class=\"t\">수면<\/text><text x=\"62\" y=\"134\" font-size=\"11\" fill=\"#111\" stroke=\"none\" class=\"t\">수심 20~100m<\/text><text x=\"130\" y=\"186\" font-size=\"11\" fill=\"#111\" stroke=\"none\" class=\"t\">참돔<\/text><text x=\"290\" y=\"34\" font-size=\"11\" fill=\"#111\" stroke=\"none\" class=\"t\">낚싯배<\/text><\/svg>"}, {"title": "생미끼 시대", "era": "루어 보급 이전 (대략 1990년대~2000년대 무렵으로 알려져 있다)", "lead": "루어(가짜 미끼)가 널리 쓰이기 전, 참돔 배낚시는 크릴·새우·갯지렁이처럼 살아 있거나 신선한 진짜 미끼를 바늘에 꿰어 쓰는 방식이 중심이었다.", "paragraphs": ["이 시기 참돔 낚시는 배 위에서 낚싯줄 한 가닥을 바닥 쪽으로 곧게 내리는 외줄낚시가 기본이었다. 미끼로는 작은 새우처럼 생긴 바다 생물인 크릴(주로 얼린 것)이 가장 많이 쓰였고, 새우나 갯지렁이도 함께 쓰였다. 이런 방식은 일본의 참돔 낚시 기법에서 영향을 받은 것으로 알려져 있다.", "대표적인 채비(낚시 도구를 엮어 놓은 한 벌)는 L자 모양 쇠막대인 편대(일본말로 텐빈)에 밑밥통을 매단 형태다. 밑밥통에 크릴을 넣어 물속에서 조금씩 흩어지게 하면 참돔이 모여들고, 편대 끝에 이어진 수 미터 길이의 목줄이 미끼를 밑밥 사이에 자연스럽게 떠다니게 한다. 바닥에 바위가 많은 곳에서는 걸리면 일부러 끊어지도록 약한 줄에 단 봉돌(버림봉돌)을 쓰기도 한다."], "keyPoints": ["크릴·새우·갯지렁이 같은 진짜 미끼를 쓰는 외줄 배낚시가 중심이었다.", "L자 편대+밑밥통+긴 목줄 채비로 밑밥 사이에 미끼를 섞어 참돔을 불러 모았다.", "입질은 좋지만 미끼 준비가 번거롭고, 잡어가 미끼를 뜯거나 줄이 엉키기 쉽다."], "glossary": [{"term": "편대(텐빈)", "meaning": "원줄과 목줄 사이에 다는 L자 모양 쇠막대. 줄 엉킴을 줄이고 밑밥통을 매다는 데 쓴다"}, {"term": "밑밥(코마세)", "meaning": "물고기를 한곳에 모으려고 물속에 뿌리는 먹이. 참돔 낚시에서는 주로 크릴을 쓴다"}, {"term": "목줄", "meaning": "바늘에 직접 묶는 가는 줄. 물고기가 줄을 덜 알아채도록 원줄보다 가늘게 쓴다"}], "svg": "<svg viewBox=\"0 0 400 260\" xmlns=\"http://www.w3.org/2000/svg\"><g fill=\"none\" stroke=\"#111\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\" d=\"M10 30 q15 -6 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M20 42 q12 -4 24 0 t24 0 t24 0 M300 44 q12 -4 24 0 t24 0 t24 0\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.6\" d=\"M120 10 L120 95\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"2.2\" d=\"M120 95 L120 130 L230 130\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" d=\"M120 95 a4 4 0 1 0 0.1 0\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\" d=\"M120 130 L120 145\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.8\" d=\"M104 145 L136 145 L132 195 L108 195 Z\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M110 155 L130 155 M110 165 L130 165 M110 175 L129 175 M111 185 L129 185\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M112 150 L112 192 M120 150 L120 192 M128 150 L128 192\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\" d=\"M104 145 q16 -10 32 0\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" d=\"M120 195 L120 205\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\" d=\"M114 205 q6 -4 12 0 l-2 12 q-4 3 -8 0 Z\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M100 205 l-6 4 M140 205 l6 4 M104 214 l-7 2 M136 214 l7 2\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\" d=\"M230 130 q30 20 50 40 t40 50\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.8\" d=\"M320 220 q2 10 -6 12 q-6 0 -6 -6\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.6\" d=\"M321 214 q14 4 18 16 q-4 6 -10 3 q-6 -5 -8 -19\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M326 222 l4 -2 M330 228 l5 -2 M339 230 l6 2 M339 232 l5 5\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.6\" d=\"M250 80 q30 -22 70 -10 q20 6 30 18 q-12 10 -30 14 q-40 8 -70 -10 Z\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.6\" d=\"M250 80 l-18 -12 l4 22 l-4 20 l18 -12\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M335 84 a2 2 0 1 0 0.1 0 M300 72 q-4 14 0 26 M280 74 q-4 12 0 22\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M290 68 q10 -10 26 -4\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M150 175 l3 -2 M160 165 l2 2 M170 185 l3 0 M158 190 l2 2 M180 175 l2 -2\"/><\/g><text font-size=\"11\" fill=\"#111\" stroke=\"none\" class=\"t\" x=\"126\" y=\"60\">원줄<\/text><text font-size=\"11\" fill=\"#111\" stroke=\"none\" class=\"t\" x=\"150\" y=\"124\">L자 편대<\/text><text font-size=\"11\" fill=\"#111\" stroke=\"none\" class=\"t\" x=\"58\" y=\"175\">밑밥통<\/text><text font-size=\"11\" fill=\"#111\" stroke=\"none\" class=\"t\" x=\"236\" y=\"200\">긴 목줄·크릴<\/text><\/svg>"}, {"title": "타이라바의 등장", "era": "에도 시대 무렵 전통 어구 → 2000년대 일본 레저 낚시 → 2010년 전후 한국 전래", "lead": "타이라바는 일본 세토내해 어부들이 참돔을 잡을 때 쓰던 전통 어구 '카부라'에서 비롯된 인조 미끼(가짜 미끼)로, 2010년 전후 한국 남해안에 들어와 참돔 낚시 방식을 크게 바꾸어 놓은 것으로 알려져 있다.", "paragraphs": ["타이라바라는 이름은 일본어로 참돔을 뜻하는 '타이(鯛)'와 고무를 뜻하는 영어 '러버(rubber)'의 일본식 발음 '라바'를 합친 말로 알려져 있다. 원형인 카부라는 세토내해 어부들이 오래전부터, 에도 시대 무렵부터 써 왔다고 전해지는 단순한 어구로, 무거운 추 머리에 바늘과 끈을 달아 바다 밑바닥 근처를 오르내리게 하는 방식이었다. 이것이 둥근 금속 머리(헤드), 하늘거리는 고무 술(스커트), 꼬리처럼 흔들리는 얇은 고무 띠(넥타이), 그리고 바늘을 갖춘 오늘날의 형태로 다듬어졌다.", "일본에서는 2000년대 무렵 레저 낚시용으로 개량되어 널리 퍼진 것으로 알려져 있다. 한국에는 2010년 전후 남해안을 중심으로 소개되었고, 미끼를 따로 끼울 필요가 없고 조작이 쉬워 비교적 짧은 기간에 크게 유행했다."], "keyPoints": ["타이라바는 세토내해의 전통 어구 카부라에서 유래한 것으로 알려져 있다.", "헤드·스커트·넥타이·어시스트 바늘로 이루어지며, 생미끼 없이 쓴다.", "바닥에 닿게 한 뒤 일정한 속도로 감고, 입질이 와도 서둘러 챔질하지 않는다."], "glossary": [{"term": "등속 리트리브", "meaning": "릴 손잡이를 빠르지도 느리지도 않게 같은 속도로 계속 감는 동작."}, {"term": "챔질", "meaning": "입질이 왔을 때 낚싯대를 들어 올려 바늘을 물고기 입에 걸리게 하는 동작."}, {"term": "어시스트 바늘", "meaning": "헤드에 직접 붙지 않고 짧은 줄에 매달려 자유롭게 움직이는 보조 바늘."}], "svg": "<svg viewBox=\"0 0 400 260\" xmlns=\"http://www.w3.org/2000/svg\"><path class=\"d\" d=\"M60 30 L60 70\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path class=\"d\" d=\"M60 70 a6 6 0 1 0 0.1 0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path class=\"d\" d=\"M60 82 C30 82 22 110 30 128 C40 150 80 150 90 128 C98 110 90 82 60 82 Z\" fill=\"none\" stroke=\"#111\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path class=\"d\" d=\"M40 100 L52 92 M38 112 L62 92 M40 124 L74 94 M48 132 L82 104 M60 136 L84 116\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path class=\"d\" d=\"M60 102 a5 5 0 1 0 0.1 0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path class=\"d\" d=\"M150 60 L150 100\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path class=\"d\" d=\"M150 100 C135 130 130 160 128 190 M150 100 C142 135 140 165 140 195 M150 100 C150 135 150 165 150 198 M150 100 C158 135 160 165 160 195 M150 100 C165 130 170 160 172 190\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path class=\"d\" d=\"M240 60 C232 90 250 110 238 140 C228 165 246 185 236 215\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path class=\"d\" d=\"M250 60 C258 92 240 112 254 142 C266 168 246 188 258 218\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path class=\"d\" d=\"M236 215 L240 222 L244 214 M258 218 L262 225 L264 216\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path class=\"d\" d=\"M320 50 L320 60\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path class=\"d\" d=\"M320 60 a5 5 0 1 0 0.1 0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path class=\"d\" d=\"M318 70 C305 100 300 120 302 140\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path class=\"d\" d=\"M322 70 C335 100 342 125 344 150\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path class=\"d\" d=\"M302 140 L302 165 C302 180 286 180 286 166 L290 162\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path class=\"d\" d=\"M344 150 L344 175 C344 190 328 190 328 176 L332 172\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path class=\"d\" d=\"M20 245 C40 238 60 252 80 245 C100 238 120 252 140 245 C160 238 180 252 200 245 C220 238 240 252 260 245 C280 238 300 252 320 245 C340 238 360 252 380 245\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path class=\"d\" d=\"M95 110 L115 110 M190 130 L210 130 M275 110 L290 110\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" stroke-dasharray=\"2 4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"42\" y=\"168\" font-size=\"11\" fill=\"#111\" stroke=\"none\" class=\"t\">헤드<\/text><text x=\"132\" y=\"215\" font-size=\"11\" fill=\"#111\" stroke=\"none\" class=\"t\">스커트<\/text><text x=\"226\" y=\"240\" font-size=\"11\" fill=\"#111\" stroke=\"none\" class=\"t\">넥타이<\/text><text x=\"300\" y=\"205\" font-size=\"11\" fill=\"#111\" stroke=\"none\" class=\"t\">바늘 2개<\/text><\/svg>"}, {"title": "장비와 채비의 진화", "era": "2000년대 무렵 ~ 현재", "lead": "참돔처럼 바닥 가까이 사는 물고기를 노리는 루어낚시 장비는 더 가늘고 질긴 줄, 섬세한 릴과 낚싯대, 작으면서도 잘 가라앉는 헤드 쪽으로 꾸준히 발전해 왔다.", "paragraphs": ["예전에는 잘 늘어나는 나일론 줄을 많이 썼지만, 지금은 가는 섬유 여러 가닥을 꼬아 만든 PE 합사가 기본처럼 쓰인다. 합사는 거의 늘어나지 않아 물고기가 살짝 건드리는 신호(입질)까지 손에 잘 전해진다. 다만 바위 등에 쓸리면 쉽게 끊어지므로, 끝에 투명하고 질긴 쇼크리더(목줄)를 이어 쓰는 방식이 자리 잡았다.", "릴은 줄이 얼마나 풀렸는지 숫자로 보여 주는 카운터 달린 베이트릴(위쪽에 얹어 쓰는 작은 북 모양 릴)이 널리 쓰이며, 낚싯대는 끝이 부드러운 전용 제품이 늘었다. 헤드(추 역할을 하는 머리 부분)는 줄에 단단히 묶인 고정식에서, 줄을 따라 미끄러지는 유동식으로 많이 바뀐 것으로 알려져 있다. 유동식은 물고기가 물었을 때 추의 무게가 덜 느껴져, 바늘을 뱉어 낼 가능성이 줄어든다고 한다."], "keyPoints": ["잘 늘어나는 나일론 줄에서 감도 좋은 PE 합사와 쇼크리더 조합으로 바뀌었다.", "헤드는 줄에 묶인 고정식에서 줄을 따라 미끄러지는 유동식으로 많이 바뀌었다.", "납보다 작고 빨리 가라앉는 텅스텐 헤드 사용이 늘었다."], "glossary": [{"term": "PE 합사", "meaning": "가는 섬유 여러 가닥을 꼬아 만든 낚싯줄로, 거의 늘어나지 않아 작은 입질도 잘 느껴진다."}, {"term": "쇼크리더", "meaning": "합사 끝에 이어 다는 질긴 목줄로, 바위 쓸림과 갑작스러운 충격에서 줄을 지켜 준다."}, {"term": "유동식 헤드", "meaning": "줄에 고정되지 않고 줄을 따라 미끄러지는 추로, 물고기가 물었을 때 무게를 덜 느낀다."}], "svg": "<svg viewBox=\"0 0 400 260\" xmlns=\"http://www.w3.org/2000/svg\"><g fill=\"none\" stroke=\"#111\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\" d=\"M70 20 L70 95\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"2.2\" d=\"M48 95 Q70 80 92 95 Q96 125 70 135 Q44 125 48 95 Z\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M55 100 L62 125 M63 98 L72 130 M72 97 L82 126 M81 99 L88 115\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.6\" d=\"M70 135 L70 150 Q70 168 58 165\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" d=\"M66 145 Q50 160 60 180 M74 145 Q90 160 80 180\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\" d=\"M200 20 L200 175\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\" d=\"M184 85 Q200 72 216 85 Q218 108 200 115 Q182 108 184 85 Z\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M190 90 L196 108 M198 86 L204 112 M206 88 L211 104\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.6\" d=\"M200 175 Q200 192 188 189\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" d=\"M196 168 Q182 180 190 198 M204 168 Q218 180 210 198\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M222 80 L222 120 M218 115 L222 121 L226 115\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\" d=\"M330 20 L330 175\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\" d=\"M321 95 Q330 87 339 95 Q340 108 330 112 Q320 108 321 95 Z\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M325 98 L329 108 M331 96 L335 106\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.6\" d=\"M330 175 Q330 192 318 189\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" d=\"M326 168 Q312 180 320 198 M334 168 Q348 180 340 198\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M20 40 Q30 36 40 40 Q50 44 60 40 M100 40 Q115 36 130 40 Q145 44 160 40 M240 40 Q255 36 270 40 Q285 44 300 40 M350 40 Q365 36 380 40\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\" d=\"M30 228 L370 228\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\" d=\"M358 220 L372 228 L358 236\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M130 222 L130 234 M260 222 L260 234\"/><\/g><text x=\"38\" y=\"252\" font-size=\"11\" fill=\"#111\" stroke=\"none\" class=\"t\">납 고정식<\/text><text x=\"180\" y=\"252\" font-size=\"11\" fill=\"#111\" stroke=\"none\" class=\"t\">유동식<\/text><text x=\"298\" y=\"252\" font-size=\"11\" fill=\"#111\" stroke=\"none\" class=\"t\">텅스텐 소형<\/text><\/svg>"}, {"title": "오늘의 참돔 선상낚시와 초보 팁", "era": "2010년대 무렵 ~ 현재", "lead": "오늘날의 참돔 선상낚시는 발전한 장비와 자원 보호 의식이 함께 자리 잡아, 초보도 비교적 쉽게 도전할 수 있는 낚시로 여겨진다.", "paragraphs": ["최근에는 고성능 어군탐지기(어탐)가 널리 쓰이고, 물속 물고기의 움직임을 거의 실시간으로 보여 주는 라이브 소나를 쓰는 배도 늘고 있는 것으로 알려져 있다. 깊은 바다에서 줄을 감는 수고를 덜어 주는 전동릴(전기로 줄을 감는 릴)도 보조 장비로 쓰인다. 낚시꾼들은 타이라바 같은 인조 미끼(루어)의 색과 무게를 상황에 맞춰 바꿔 가며 쓰는데, 이를 흔히 '로테이션'이라고 부른다.", "자원 보호에 대한 인식도 높아졌다. 잡은 물고기를 다시 놓아주는 캐치앤릴리즈가 퍼지고 있으며, 금어기(잡으면 안 되는 기간)와 체장 규정(잡아도 되는 최소 크기)을 지키는 것이 낚시꾼의 기본 예절로 여겨진다. 규정은 바뀔 수 있으므로 출조(낚시하러 나가는 것) 전에 최신 내용을 확인하는 것이 좋다."], "keyPoints": ["어탐·라이브 소나·전동릴 등 장비 발전으로 물고기 찾기와 끌어올리기가 한결 쉬워졌다.", "금어기와 체장 규정을 지키고, 필요하면 캐치앤릴리즈로 자원을 보호한다.", "초보 3원칙: 선장 추천 무게 사용, 바닥 닿음 확인, 입질이 와도 감던 속도 유지."], "glossary": [{"term": "어탐(어군탐지기)", "meaning": "음파를 쏘아 물속 물고기 떼와 바닥 모양을 화면으로 보여 주는 장비."}, {"term": "체장 규정", "meaning": "물고기 몸길이가 정해진 크기 이상일 때만 잡아 갈 수 있도록 한 규칙."}, {"term": "입질", "meaning": "물고기가 미끼를 건드리거나 물 때 그 느낌이 낚싯대나 줄로 전해지는 것."}], "svg": "<svg viewBox=\"0 0 400 260\" xmlns=\"http://www.w3.org/2000/svg\"><g fill=\"none\" stroke=\"#111\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"2.2\" d=\"M20 150 L250 150 L235 180 L40 180 Z\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" d=\"M60 150 L60 120 L110 120 L110 150\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M70 128 L100 128 M70 136 L100 136\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M50 165 L60 175 M80 165 L90 175 M110 165 L120 175 M140 165 L150 175 M170 165 L180 175 M200 165 L210 175\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.6\" d=\"M175 92 a8 8 0 1 0 0.1 0\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.8\" d=\"M175 108 L172 135 L165 150 M172 135 L182 150\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.6\" d=\"M175 112 L195 105 L205 98\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.6\" d=\"M175 116 L198 110\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\" d=\"M200 102 Q260 40 320 70\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M320 70 L330 190\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.8\" d=\"M310 200 Q330 185 355 195 Q345 200 355 210 Q330 218 310 200 Z\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\" d=\"M355 195 L372 186 L368 203 L372 218 L355 210\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M322 193 Q330 188 340 190 M318 199 a1.5 1.5 0 1 0 0.1 0\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M325 205 Q335 210 345 206\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.3\" d=\"M5 185 Q20 178 35 185 T65 185 T95 185 T125 185 T155 185 T185 185 T215 185 T245 185 T275 185 T305 185\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M10 200 Q25 194 40 200 T70 200 T100 200 T130 200 T160 200 T190 200 T220 200 T250 200 T280 200\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M20 220 Q35 214 50 220 T80 220 T110 220 T140 220 T170 220 T200 220 T230 220 T260 220 T290 220 T320 220 T350 220 T380 220\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M60 240 Q75 234 90 240 T120 240 T150 240 T180 240 T210 240 T240 240\"/><path class=\"d\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" d=\"M340 40 Q350 30 360 40 M355 50 Q362 43 369 50\"/><\/g><text x=\"150\" y=\"80\" font-size=\"11\" fill=\"#111\" stroke=\"none\" class=\"t\">낚시꾼<\/text><text x=\"255\" y=\"40\" font-size=\"11\" fill=\"#111\" stroke=\"none\" class=\"t\">휘어진 낚싯대<\/text><text x=\"300\" y=\"240\" font-size=\"11\" fill=\"#111\" stroke=\"none\" class=\"t\">참돔<\/text><\/svg>"}];
const toc=document.getElementById('toc'), main=document.getElementById('main');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
DATA.forEach((s,i)=>{
  toc.insertAdjacentHTML('beforeend',`<li><a href="#s${i}">${esc(s.title)}</a> <span class="era">${esc(s.era)}</span></li>`);
  main.insertAdjacentHTML('beforeend',`<section class="entry" id="s${i}">
    <div class="num reveal">No. ${i+1}</div>
    <h2 class="reveal">${esc(s.title)}</h2><span class="era reveal">${esc(s.era)}</span>
    <p class="lead reveal">${esc(s.lead)}</p>
    <figure class="reveal">${s.svg}<figcaption>fig. ${i+1}: ${esc(s.title)}</figcaption></figure>
    ${s.paragraphs.map(p=>`<p class="reveal">${esc(p)}</p>`).join('')}
    <ul class="points reveal">${s.keyPoints.map(k=>`<li>${esc(k)}</li>`).join('')}</ul>
    <div class="gloss reveal"><div class="g-title">용어 풀이</div>${s.glossary.map(g=>`<div><b>${esc(g.term)}</b>: ${esc(g.meaning)}</div>`).join('')}</div>
  </section>`);
});
document.querySelectorAll('svg').forEach(svg=>{
  svg.querySelectorAll('script,foreignObject').forEach(n=>n.remove());
  const paths=[...svg.querySelectorAll('path,line,polyline,polygon,circle,ellipse,rect')];
  paths.forEach(p=>{if(!p.classList.contains('d'))p.classList.add('d');});
  const n=paths.length, total=Math.min(4.5,1.2+n*.08);
  paths.forEach((p,k)=>{
    let L=1000;try{L=Math.ceil(p.getTotalLength())+2}catch(e){}
    p.style.setProperty('--len',L);
    p.style.setProperty('--delay',(k*(total/Math.max(n,1))).toFixed(2)+'s');
    p.style.setProperty('--dur',Math.min(1.6,.4+L/400).toFixed(2)+'s');
  });
  svg.style.setProperty('--tdelay',(total+.3).toFixed(1)+'s');
  svg.querySelectorAll('.t').forEach(t=>t.style.animationDelay=(total+.3)+'s');
});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){
  e.target.classList.add(e.target.tagName.toLowerCase()==='svg'?'go':'in');io.unobserve(e.target);}}),{threshold:.25});
document.querySelectorAll('.reveal,svg').forEach(el=>io.observe(el));
const bar=document.getElementById('bar'),clock=document.getElementById('clock');
const TOUR={total:340,elapsed:0,done:false,running:false};window.__tour=TOUR;
addEventListener('scroll',()=>{const h=document.documentElement;const r=h.scrollTop/(h.scrollHeight-h.clientHeight||1);
  bar.style.width=(r*100)+'%';if(TOUR.running||TOUR.done)return;const left=Math.max(0,Math.round(6*(1-r)));clock.textContent=left?`⏱ 남은 시간 약 ${left}분`:'✓ 다 읽었어요!';});
// 6분 자동 읽기: 섹션별 글자 수에 비례해 시간을 나눠, 총 340초(5분 40초)에 반드시 끝난다
const speed=Math.max(1,+(new URLSearchParams(location.search).get('speed')||1));
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
document.getElementById('play').onclick=()=>{
  if(TOUR.running)return;
  const secs=[...document.querySelectorAll('section.entry')];
  const w=secs.map(s=>s.innerText.replace(/\s/g,'').length), W=w.reduce((a,b)=>a+b,0);
  const intro=10, avail=TOUR.total-intro; let acc=intro; const marks=[[0,0]];
  secs.forEach((s,i)=>{marks.push([acc,s.offsetTop-20]);acc+=avail*w[i]/W;});
  const h=document.documentElement; marks.push([TOUR.total,h.scrollHeight-h.clientHeight]);
  document.documentElement.style.scrollBehavior='auto';
  TOUR.running=true;TOUR.done=false;const t0=performance.now();
  (function step(now){
    const t=Math.min(TOUR.total,(now-t0)/1000*speed);TOUR.elapsed=t;
    let k=0;while(k<marks.length-2&&marks[k+1][0]<=t)k++;
    const [ta,ya]=marks[k],[tb,yb]=marks[k+1];const y=ya+(yb-ya)*((t-ta)/((tb-ta)||1));
    scrollTo(0,y);clock.textContent=`▶ ${fmt(t)} / 6:00`;
    if(t<TOUR.total)requestAnimationFrame(step);
    else{TOUR.running=false;TOUR.done=true;clock.textContent=`✓ ${fmt(t)}에 끝! (6분 이내)`;}
  })(t0);
};
</script>
